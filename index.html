<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>외관조사 망도</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="외관조사망도">
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="gate.js"></script>
<script>window.STANDALONE=true;window.APP_VERSION="202611161708";
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>

<script src="lib/pdf.min.js"></script>
<script src="lib/pdf.worker.min.js"></script>
<script src="lib/xlsx.full.min.js"></script>
<script src="lib/jszip.min.js"></script>
<script src="lib/jspdf.umd.min.js"></script>
<style>
:root{color-scheme:light;--bg:#f4f5f7;--panel:#fff;--line:#dfe2e7;--ink:#1d2330;--sub:#6b7280;--acc:#2563eb;--danger:#dc2626}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:14px;overflow:hidden;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
select option{color:#1d2330;background:#fff}
input,select,textarea{font:inherit;-webkit-user-select:text;user-select:text}
#app{display:grid;grid-template-rows:52px 1fr;grid-template-columns:76px 1fr auto;height:100%}
#top{grid-column:1/4;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line)}
#top .title{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 11px;white-space:nowrap}
.btn.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.dng{color:var(--danger);border-color:#f3c2c2}
.btn:disabled{opacity:.4}
.btn.on{background:#e8efff;border-color:var(--acc);color:var(--acc)}
.sp{flex:1}
#pager{display:flex;align-items:center;gap:4px}
#pageLabel{min-width:150px;text-align:center;font-weight:600;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
#tools{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:6px 4px;display:flex;flex-direction:column;gap:4px}
.tool{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid transparent;border-radius:8px;padding:4px 2px;background:none;font-size:10.5px;line-height:1.15;text-align:center}
.tool svg{width:40px;height:22px}
.tool.on{border-color:var(--acc);background:#e8efff}
.tool .mode{font-size:20px;line-height:22px}
.sep{height:1px;background:var(--line);margin:4px 2px}
#view{position:relative;overflow:hidden;background:#cfd3da;touch-action:none}
#content{position:absolute;left:0;top:0;transform-origin:0 0;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.25)}
#content img{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;-webkit-user-drag:none}
#ov{position:absolute;left:0;top:0;overflow:visible}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:#374151;text-align:center;padding:20px}
#hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:rgba(17,24,39,.85);color:#fff;padding:7px 14px;border-radius:20px;font-size:13px;pointer-events:none;display:none;white-space:nowrap}
#side{width:330px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#side.hide{display:none}
#side h3{margin:0;padding:10px 12px;font-size:14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
#list{overflow-y:auto;flex:1}
table.dl{width:100%;border-collapse:collapse;font-size:12px}
table.dl th{position:sticky;top:0;background:#f8f9fb;font-weight:600;color:var(--sub);padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
table.dl td{padding:6px 4px;border-bottom:1px solid #eef0f3;vertical-align:top}
table.dl tr.sel td{background:#eef3ff}
table.dl tr{cursor:pointer}
.num{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;border:1.5px solid #111;font-size:11px;font-weight:700}
.muted{color:var(--sub);font-size:12px}
#sum{padding:8px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--sub);max-height:150px;overflow:auto}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-end;justify-content:center;z-index:50}
.modal.show{display:flex}
.sheet{background:#fff;width:min(640px,100%);max-height:92vh;overflow-y:auto;border-radius:14px 14px 0 0;padding:16px 18px 22px;box-shadow:0 -4px 24px rgba(0,0,0,.2)}
.modal.center{align-items:center}
.modal.center .sheet{border-radius:14px}
.sheet h2{margin:0 0 12px;font-size:17px;display:flex;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.f{display:flex;flex-direction:column;gap:4px}
.f.c2{grid-column:span 2}.f.c3{grid-column:span 3}
.f label{font-size:12px;color:var(--sub)}
.f input,.f select,.f textarea{border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:16px;background:#fff;width:100%}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:#fff;padding:9px 4px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--acc);color:#fff}
.row{display:flex;gap:8px;align-items:center}
.actions{display:flex;gap:8px;margin-top:16px}
.qty{font-weight:700;font-size:16px;padding:9px 0}
.plist{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.pitem{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.pitem.cur{border-color:var(--acc);background:#f3f7ff}
.pitem .nm{font-weight:600;flex:1}
.menu{display:flex;flex-direction:column;gap:8px}
.menu .btn{text-align:left;padding:12px 14px}
.menu .btn small{display:block;color:var(--sub);font-size:12px;margin-top:2px}
#toast{position:fixed;top:62px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:9px 16px;border-radius:10px;z-index:80;display:none;font-size:13px;max-width:90vw}
#status{font-size:11px;color:var(--sub);white-space:nowrap}
.prog{height:6px;background:#e5e7eb;border-radius:3px;overflow:hidden;margin-top:10px}.prog i{display:block;height:100%;background:var(--acc);width:0}
@media (max-width:900px){#side{width:270px}#top .title{max-width:120px}#pageLabel{min-width:90px;max-width:150px}}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <button class="btn" id="bProj">☰ 시설물</button>
    <div class="title" id="projTitle">시설물을 선택하세요</div>
    <div class="sp"></div>
    <div id="pager">
      <button class="btn" id="bPrev">◀</button>
      <button id="pageLabel">도면 없음</button>
      <button class="btn" id="bNext">▶</button>
    </div>
    <button class="btn" id="bPageSet">도면정보</button><button class="btn" id="bLegend">범례</button>
    <div class="sp"></div>
    <span id="status"></span>
    <button class="btn" id="bReload" title="새로고침">↻ 새로고침</button>
    <button class="btn" id="bFinger" title="손가락으로도 그리기">✋ 손가락 그리기</button>
    <button class="btn" id="bList">목록</button>
    <button class="btn pri" id="bExport">내보내기</button>
  </div>
  <div id="tools"></div>
  <div id="view">
    <div id="content"><img id="pimg" alt=""><svg id="ov" xmlns="http://www.w3.org/2000/svg"></svg></div>
    <div id="empty"></div>
    <div id="hint"></div>
    <div id="eraseBar" style="position:absolute;left:50%;bottom:84px;transform:translateX(-50%);display:none;gap:8px;align-items:center;z-index:6;background:#111827;color:#fff;border-radius:12px;padding:6px 8px 6px 14px;font-size:14px;white-space:nowrap"><span id="eraseTxt"></span><button class="btn" id="eraseClr" style="padding:6px 10px;background:#fff;color:#111827;border-color:#fff">선택 해제</button><button class="btn" id="eraseDel" style="padding:6px 12px;background:#dc2626;border-color:#dc2626;color:#fff;font-weight:700">🗑 삭제</button></div>
    <div id="multiBar" style="position:absolute;left:50%;top:10px;transform:translateX(-50%);display:none;gap:8px;align-items:center;z-index:6;background:#111827;color:#fff;border-radius:12px;padding:6px 8px 6px 14px;font-size:14px"><span id="multiTxt"></span><button class="btn" id="multiUndo" style="padding:6px 10px;background:#fff;color:#111827;border-color:#fff">마지막 지우기</button><button class="btn" id="multiDone" style="padding:6px 12px;background:#fde047;border-color:#fde047;color:#111827;font-weight:700">완료</button></div>
    <div id="zoneBar" style="position:absolute;left:10px;top:10px;display:none;gap:6px;flex-wrap:wrap;z-index:5"><button class="btn" id="zBand">▤ 띠로 나누기</button><button class="btn" id="zBox">□ 작은 구역</button><button class="btn" id="zAi">🤖 부재 이름 읽기</button><button class="btn" id="zAiAll">🤖 전체 도면</button><button class="btn" id="zCopy">같은 부재 도면에 복사</button><button class="btn dng" id="zClear">구역 지우기</button><button class="btn pri" id="zDone">완료</button></div>
  </div>
  <div id="side">
    <h3><span id="listTitle">손상 목록</span><span class="muted" id="listCount"></span><button class="btn" id="bExistOne" style="padding:4px 8px;font-size:12px">기존 손상 판독</button></h3>
    <div id="list"></div>
    <div id="sum"></div>
  </div>
</div>

<!-- 손상 입력 -->
<div class="modal" id="mMark"><div class="sheet">
  <h2><span class="num" id="fNum">1</span><span id="fTitle">손상 입력</span></h2>
  <div class="grid">
    <div class="f c3" id="fExist" style="display:none;background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:8px"><label>기존 손상 <b id="fOld"></b>번 — 현장 확인</label><div class="row"><div class="seg" id="fCheck" style="flex:1"></div><button class="btn" id="fPin">위치 지정</button></div></div>
    <div class="f c3"><label>범례 종류</label><select id="fType" hidden></select><div id="fTypeGrid" style="display:flex;flex-wrap:wrap;gap:4px;max-height:148px;overflow:auto"></div></div>
    <div class="f c3" style="display:none"><label>구분</label><div class="seg" id="fStatus"></div></div>
    <div class="f"><label>손상위치(부재)</label><input id="fLoc" list="dlLoc" autocomplete="off"></div>
    <div class="f c2"><label>손상내용</label><input id="fDesc" list="dlDesc" autocomplete="off"></div>
    <div class="f c3" id="fLocChipsW" style="display:none"><label>부재 빠른 선택</label><div id="fLocChips" style="display:flex;flex-wrap:wrap;gap:5px"></div></div>
    <div class="f"><label>경간</label><input id="fSpan" autocomplete="off"></div>
    <div class="f"><label>폭 (mm)</label><input id="fW" inputmode="decimal" autocomplete="off"></div>
    <div class="f"><label>길이 (m)</label><input id="fL" inputmode="decimal" autocomplete="off"></div>
    <div class="f"><label>너비 (m)</label><input id="fB" inputmode="decimal" autocomplete="off"></div>
    <div class="f"><label>개소</label><input id="fCnt" inputmode="decimal" autocomplete="off"></div>
    <div class="f"><label>물량</label><div class="qty" id="fQty">-</div></div>
    <div class="f c2"><label>사진번호 (예: 1045, 1046 / 5022~5023)</label><div class="row"><input id="fPhoto" inputmode="text" autocomplete="off"><button class="btn" id="fPhotoNext">+1</button></div></div>
    <div class="f"><label>조사자</label><input id="fAuthor" autocomplete="off"></div>
    <div class="f c3"><label>비고</label><input id="fNote" autocomplete="off"></div>
  </div>
  <div class="actions"><button class="btn dng" id="fDel">삭제</button><div class="sp"></div><button class="btn" id="fMulti" title="같은 크기의 손상을 여러 곳에 그려 한 번호로 묶기">＋ 같은 손상 여러 개</button><button class="btn" id="fDup" title="같은 자리에 겹친 손상을 하나 더 추가">＋ 중복 손상 추가</button><button class="btn" id="fCancel">취소</button><button class="btn pri" id="fSave">저장</button></div>
</div></div>
<datalist id="dlLoc"></datalist><datalist id="dlDesc"></datalist>

<!-- 시설물 -->
<div class="modal center" id="mProj"><div class="sheet">
  <h2>시설물 (사진번호 폴더명)</h2>
  <div class="plist" id="projList"></div>
  <div class="row" style="margin-top:6px"><button class="btn" id="bPkgProj" style="flex:1">📥 준비 패키지(.zip)로 시설물 불러오기</button></div>
  <div class="row" style="margin-top:10px"><div class="seg" id="newType" style="flex:0 0 auto"><button data-t="bridge" class="on">교량</button><button data-t="tunnel">터널</button></div><input id="newProj" placeholder="새 시설물명 (사진번호 앱 폴더명과 똑같이)" style="flex:1;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:16px"><button class="btn pri" id="bNewProj">추가</button></div>
  <div class="actions"><div class="sp"></div><button class="btn" data-close>닫기</button></div>
</div></div>

<!-- 도면 목록 -->
<div class="modal center" id="mPages"><div class="sheet">
  <h2>도면</h2>
  <div class="plist" id="pageList"></div>
  <div class="row" style="margin-top:6px;flex-wrap:wrap"><button class="btn pri" id="bImport">＋ 도면 불러오기 (PDF·이미지)</button><button class="btn pri" id="bStd">＋ 표준 망도 만들기</button><button class="btn" id="bReread">AI로 도면명·번호·범례 다시 읽기</button><button class="btn" id="bExistAll">AI로 기존 손상(물량표) 읽기</button><input type="file" id="fileIn" accept="application/pdf,image/*" multiple hidden></div>
  <div class="row" style="margin-top:10px"><span class="muted">보수된 기존 손상</span><div class="seg" id="repMode" style="flex:0 0 auto;white-space:nowrap"><button data-r="keep">목록에 남김</button><button data-r="remove">빼고 번호 당김</button></div></div>
  <div id="impProg" style="display:none"><div class="muted" id="impText"></div><div class="prog"><i id="impBar"></i></div></div>
  <div class="actions"><div class="sp"></div><button class="btn" data-close>닫기</button></div>
</div></div>

<!-- 도면 정보 -->
<div class="modal center" id="mPage"><div class="sheet">
  <h2>도면 정보</h2>
  <div class="grid">
    <div class="f c2"><label>도면명 (부재·위치)</label><input id="pName"></div><div class="f"><label>도면번호</label><input id="pNo"></div>
    <div class="f"><label>망도부재 (엑셀 A열)</label><input id="pMember" list="dlMember"></div>
    <div class="f"><label>S/N</label><input id="pSn" inputmode="numeric"></div>
    <div class="f"><label>기본 경간</label><input id="pSpan"></div>
    <div class="f c3"><label>축척</label><div class="row"><span id="pScaleTxt" class="muted" style="flex:1"></span><button class="btn" id="bScale">기준선으로 축척 설정</button><button class="btn" id="bScaleClr">해제</button></div></div>
    <div class="f c3" id="pIgnW"><label>판독 제외 구역 <span class="muted">(기존 손상 위치를 읽을 때 무시할 곳: 줄 번호 ①②③, KEY PLAN 등)</span></label><div class="row"><span id="pIgnTxt" class="muted" style="flex:1"></span><button class="btn" id="bIgnAdd">＋ 구역 그리기</button><button class="btn" id="bIgnClr">모두 지우기</button></div></div>
  </div>
  <div class="actions"><button class="btn dng" id="pDel">도면 삭제</button><div class="sp"></div><button class="btn" data-close>취소</button><button class="btn pri" id="pSave">저장</button></div>
</div></div>
<datalist id="dlMember"><option>교면포장</option><option>바닥판하면</option><option>거더외부</option><option>거더내부</option><option>교대</option><option>교각</option><option>접속옹벽</option><option>슬래브</option><option>제방</option><option>호안</option></datalist>

<!-- 내보내기 -->
<div class="modal center" id="mExport"><div class="sheet">
  <h2>내보내기</h2>
  <div class="menu">
    <button class="btn" id="eXlsx">📊 손상물량표 엑셀 (.xlsx)<small>망도 물량표 열 순서 그대로 · 기존+신규 번호순 · 손상집계·사진목록 시트</small></button>
    <button class="btn" id="ePdf">📄 망도 + 물량표 PDF (전체 도면)<small>도면 안 물량표를 새 목록으로 채우고 신규 손상을 그린 망도</small></button>
    <button class="btn" id="eDxf">📐 캐드 도면 DXF (.zip)<small>지스타캐드용 · 범례별 레이어, 손상번호, 물량표(TABLE 레이어) 포함</small></button>
    <button class="btn" id="ePng">🖼 현재 도면 이미지 (.png)<small>물량표 채움 + 신규 손상이 그려진 현재 망도</small></button>
    <button class="btn" id="ePkg">📦 준비 패키지 내보내기 (.zip)<small>도면·범례·기존 손상을 묶어 팀원 독립 앱으로 넘기기</small></button>
    <button class="btn" id="iPkg">📥 준비 패키지 불러오기<small>받은 패키지로 시설물을 그대로 만들기</small></button><input type="file" id="pkgIn" accept=".zip,application/zip" hidden>
    <button class="btn" id="eJson">💾 작업파일 백업 (.json)<small>인터넷이 안 될 때 보관·팀원 작업 합치기용</small></button>
    <button class="btn" id="iJson">📥 작업파일 불러오기·합치기<small>다른 팀원의 작업파일을 현재 시설물에 합칩니다</small></button>
    <input type="file" id="jsonIn" accept="application/json,.json" hidden>
  </div>
  <div class="actions"><div class="sp"></div><button class="btn" data-close>닫기</button></div>
</div></div>

<!-- 입력 다이얼로그 -->
<div class="modal center" id="mAsk"><div class="sheet">
  <h2 id="askTitle"></h2><div class="muted" id="askText" style="margin-bottom:10px"></div>
  <input id="askIn" inputmode="decimal" style="width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:16px"><div id="askChips" style="display:flex;flex-wrap:wrap;gap:5px;margin-top:8px"></div>
  <div class="actions"><div class="sp"></div><button class="btn" id="askNo">취소</button><button class="btn pri" id="askOk">확인</button></div>
</div></div>
<div class="modal center" id="mConfirm"><div class="sheet">
  <h2 id="cfTitle"></h2><div id="cfText" class="muted"></div>
  <div class="actions"><div class="sp"></div><button class="btn" id="cfNo">취소</button><button class="btn dng" id="cfOk">확인</button></div>
</div></div>
<div class="modal center" id="mStd"><div class="sheet" style="width:min(720px,100%)">
  <h2>표준 외관조사망도 만들기 <span class="muted" style="font-weight:400">망도가 없는 시설물용</span></h2>

 legend().forEach(l=>{String(l.n).split(/[·,\/]|\s및\s/).concat([l.n]).forEach(part=>{const q=nrm(part);if(!q)return;let v=0;if(q===d)v=1000+(l.g===g?500:0)+(String(l.n).length===part.length?100:0)+q.length;else if(l.g===g&&d.includes(q))v=q.length;if(v>sc){sc=v;best=l}})});
 return best?{k:best.k,n:name}:{k:makeVirt(name,g).k,n:name}}
function pageMemberList(pg){const P0=S.projects.get(S.pid);const ft=(P0&&P0.facType)||"bridge";const form=P0&&P0.bridgeForm;
 const cat=MEMBER_CAT[ft].filter(m=>!m.only||!form||(m.only==="steel"?form==="stbox":form!=="stbox"));
 const findCat=n=>{const q=nrm(n);return cat.find(m=>nrm(m.n)===q||m.al.some(a=>nrm(a)===q))||cat.find(m=>m.al.some(a=>q.includes(nrm(a))&&nrm(a).length>=2))};
 const names=memberSuggest(pg);const out=[];const used=new Set();
 names.forEach(n=>{const c=findCat(n);const key=n+"|"+(c?c.n:"");if(used.has(n))return;used.add(n);out.push({label:n,loc:n,cat:c})});
 cat.forEach(c=>{if(!out.some(o=>o.cat===c))out.push({label:c.n,loc:c.n.replace(/\(.*\)/,""),cat:c,extra:true})});
 return out}
const ACI=[[1,255,0,0],[2,255,255,0],[3,0,200,0],[4,0,200,200],[5,0,0,255],[6,255,0,255],[7,20,20,20],[8,128,128,128],[9,192,192,192],[30,255,127,0],[40,255,191,0],[140,0,127,255],[200,127,0,255],[14,127,63,0],[94,0,127,0]];
function hexToAci(h){const m=/^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(h||"");if(!m)return 7;const[r,g,b]=[1,2,3].map(i=>parseInt(m[i],16));let best=7,bd=1e9;ACI.forEach(([a,R,G,B])=>{const d=(r-R)**2+(g-G)**2+(b-B)**2;if(d<bd){bd=d;best=a}});return best}
function rebuildLegend(){const p=S.projects.get(S.pid);const L=p&&Array.isArray(p.legend)&&p.legend.length?p.legend:null;
 PLEG=L?L.map(it=>({k:it.id,n:it.name,g:it.kind||"area",c:it.color||"#111111",aci:hexToAci(it.color),img:it.tile||null,icon:it.swatch||null,pat:it.pat||(it.tile?null:"diag"),dash:it.dash||"",presets:(LG[it.id]&&LG[it.id].presets)||[it.name]})):null;
 if(!legend().some(l=>l.k===S.tool))S.tool=legend()[0].k;

 if(typeof buildTypeSelect==="function")buildTypeSelect();
}

 async tx(st,mode,fn){const d=await this.open();return new Promise((res,rej)=>{const t=d.transaction(st,mode);let out;const r=fn(t.objectStore(st));if(r)r.onsuccess=()=>{out=r.result};t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})},
 put(st,k,v){return this.tx(st,"readwrite",o=>o.put(v,k))},del(st,k){return this.tx(st,"readwrite",o=>o.delete(k))},get(st,k){return this.tx(st,"readonly",o=>o.get(k))},
 async all(st){const d=await this.open();return new Promise((res,rej)=>{const out=[];const t=d.transaction(st);const c=t.objectStore(st).openCursor();c.onsuccess=()=>{const cur=c.result;if(cur){out.push([cur.key,cur.value]);cur.continue()}else res(out)};c.onerror=()=>rej(c.error)})}};

/* ───────── 정렬·번호 ───────── */
function natCmp(a,b){const ax=String(a).match(/\d+|\D+/g)||[],bx=String(b).match(/\d+|\D+/g)||[];for(let i=0;i<Math.max(ax.length,bx.length);i++){const x=ax[i],y=bx[i];if(x===undefined)return-1;if(y===undefined)return 1;if(/^\d/.test(x)&&/^\d/.test(y)){const d=+x-+y;if(d)return d}else{const c=x.localeCompare(y);if(c)return c}}return 0}
function sortedPages(){return[...S.pages.values()].sort((a,b)=>(a.no&&b.no?natCmp(a.no,b.no):(a.no?-1:b.no?1:0))||(a.idx??0)-(b.idx??0))}
const pageTitle=pg=>(pg.no?pg.no+" · ":"")+(pg.name||"도면");
/* 번호 규칙: 기존 손상은 원래 번호 유지, 신규는 그 도면 마지막 번호 다음부터.
   '빼고 번호 당김' 설정이면 보수된 기존 손상을 빼고 1번부터 다시 매김 */
function numbering(pid){const all=[...S.marks.values()].filter(m=>m.page===pid&&m.origin!=="memo");
 const ex=all.filter(m=>m.origin==="existing").sort((a,b)=>natCmp(a.oldNo||"",b.oldNo||"")||(a.createdAt||0)-(b.createdAt||0));
 const nw=all.filter(m=>m.origin!=="existing").sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)||a.id.localeCompare(b.id));
 const rm=(P()&&P().repairMode)==="remove";const map={};let n=0,max=0;
 if(rm){ex.forEach(m=>{if(m.check!=="보수됨"&&!m.deleted)map[m.id]=String(++n)});nw.forEach(m=>map[m.id]=String(++n))}
 else{ex.forEach(m=>{if(!m.deleted)map[m.id]=String(m.oldNo||"");const v=parseInt(m.oldNo);if(v>max)max=v});nw.forEach((m,i)=>map[m.id]=String(max+i+1))}
 return{map,order:ex.concat(nw),next:rm?n+1:max+nw.length+1}}
function pageMarks(pid){return numbering(pid).order}

async function importFiles(files){
 const prog=$("impProg"),bar=$("impBar"),txt=$("impText");prog.style.display="block";$("bImport").disabled=true;
 let idx=sortedPages().length;let firstNew=null;const newIds=[];
 try{
  for(const f of files){
   if(f.type==="application/pdf"||/\.pdf$/i.test(f.name)){
    const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer()),isEvalSupported:false}).promise;
    for(let i=1;i<=pdf.numPages;i++){
     txt.textContent=`${f.name} — ${i}/${pdf.numPages} 페이지 변환 중`;bar.style.width=(i/pdf.numPages*100)+"%";
     const page=await pdf.getPage(i);const vp1=page.getViewport({scale:1});
     const sc=Math.min(4,3200/Math.max(vp1.width,vp1.height));const vp=page.getViewport({scale:sc});
     const cv=document.createElement("canvas");cv.width=Math.round(vp.width);cv.height=Math.round(vp.height);const ctx=cv.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,cv.width,cv.height);
     await page.render({canvasContext:ctx,viewport:vp}).promise;
     const blob=await new Promise(r=>cv.toBlob(r,"image/png"));cv.width=cv.height=1;
     let nm="",no="";try{const tc=await page.getTextContent();const t=extractTitle(tc.items,vp1.transform,pdfjsLib.Util.transform);nm=t.name;no=t.no}catch(_){}
     if(!nm)nm=pdf.numPages>1?`${f.name.replace(/\.pdf$/i,"")} p${i}`:f.name.replace(/\.pdf$/i,"");
     const id=await addPage(blob,vp1.width,vp1.height,nm,idx++,no);firstNew=firstNew||id;newIds.push(id);
    }
   }else if(f.type.startsWith("image/")){
    txt.textContent=f.name+" 불러오는 중";
    const img=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=URL.createObjectURL(f)});
    const sc=842/Math.max(img.naturalWidth,img.naturalHeight);
    const id=await addPage(f,r1(img.naturalWidth*sc),r1(img.naturalHeight*sc),f.name.replace(/\.[^.]+$/,""),idx++);firstNew=firstNew||id;newIds.push(id);
   }
  }
  toast("도면 불러오기 완료");if(firstNew){S.pageId=firstNew;showPage(true)}closeM("mPages");
 }catch(err){console.error(err);toast("도면 불러오기 실패: "+(err.message||err.code||err),6000)}
 finally{prog.style.display="none";$("bImport").disabled=false}
 if(newIds.length&&aiReady())readPages(newIds);
}
/* PDF 글자층에서 도면명·도면번호 추정 (AI를 못 쓸 때 대비) */
function extractTitle(items,vt,mul){
 const its=items.filter(i=>i.str&&i.str.trim()).map(i=>{const t=mul(vt,i.transform);const h=Math.hypot(t[2],t[3])||10;return{s:i.str,x:t[4],y:t[5],h,w:(i.width||0)*(Math.hypot(vt[0],vt[1])),up:Math.abs(t[0])>=Math.abs(t[1])}}).filter(i=>i.up);
 const lines=[];its.slice().sort((a,b)=>a.y-b.y||a.x-b.x).forEach(it=>{const L=lines.find(l=>Math.abs(l.y-it.y)<l.h*0.4&&Math.abs(l.h-it.h)<l.h*0.25&&it.x>=l.x0-2&&it.x-l.x1<l.h*1.2);if(L){L.items.push(it);L.x1=Math.max(L.x1,it.x+it.w)}else lines.push({y:it.y,h:it.h,x0:it.x,x1:it.x+it.w,items:[it]})});
 lines.forEach(l=>{l.items.sort((a,b)=>a.x-b.x);let s="";let px=null;l.items.forEach(it=>{if(px!=null&&it.x-px>l.h*0.25&&!s.endsWith(" "))s+=" ";s+=it.s;px=it.x+it.w});l.s=s.replace(/\s+/g," ").trim()});
 const bad=/기존손상|보수처리|신규손상|미보수|KEY|SECTION|PLAN|범\s*례/;
 const cands=lines.filter(l=>/[^\s\-]\s*-\s*[^\s\-]/.test(l.s)&&!/^[\d\s\-\.~]+$/.test(l.s)&&!bad.test(l.s)&&!/^[-①-⑳\d\s]*-\s/.test(l.s)).sort((a,b)=>b.h-a.h||a.y-b.y);
 let name="";
 if(cands.length){name=cands[0].s.replace(/^ID\s*/,"");if(/\s-\s/.test(name))name=name.split(/\s-\s/).pop().trim()}
 if(!name){const a=its.find(i=>/^-\s*\S/.test(i.s)&&!bad.test(i.s));if(a)name=a.s.replace(/^-\s*/,"").trim()}
 let no="";const lab=its.find(i=>/^도\s*면\s*번\s*호$/.test(i.s.trim()));
 if(lab){const pat=/^(\d{1,3}(-\d{1,4}){0,4}|[A-Za-z]{1,4}-?\d{1,4}(-\d{1,4})*)$/;const lw=lab.w||lab.h*4;
  const r=its.filter(i=>i!==lab&&pat.test(i.s.trim())&&((i.x>lab.x&&Math.abs(i.y-lab.y)<lab.h*0.8)||(i.y>lab.y&&i.y-lab.y<lab.h*4&&i.x>lab.x-lw&&i.x<lab.x+lw*2))).map(i=>({i,d:Math.hypot(i.x-lab.x,(i.y-lab.y)*2)})).sort((a,b)=>a.d-b.d)[0];if(r)no=r.i.s.trim()}
 return{name,no};
}

async function addPage(blob,w,h,name,idx,no){
 const id=uid();let asset=null;
 if(S.assets){const t=blob.type&&/^image\/(png|jpeg|webp|gif)$/.test(blob.type)?blob.type:"image/png";const r=await S.assets.upload(blob,{type:t});asset=r.id}
 else{S.localUrls[id]=URL.createObjectURL(blob);if(LOCAL)await idbSafe(IDB.put("blobs",id,blob))}
 const guess=guessMeta(name);
 const pg={id,name,no:no||"",w:r1(w),h:r1(h),asset,idx,member:guess.member,span:guess.span,sn:"",createdAt:Date.now()};
 await savePage(pg);return id;
}

 for(let i=0;i<a.length;i+=4){const L=(a[i]+a[i+1]+a[i+2])/3;if(L>228){a[i+3]=0}else{R+=a[i];G+=a[i+1];B+=a[i+2];n++}}

async function nameAsk(pg,title,cur){return await ask(title,"부재 이름을 고르거나 입력하세요. 비우면 지워요",cur||"",{list:"dlLoc",chips:memberSuggest(pg).concat(["교면포장","난간및연석","배수시설","신축이음","바닥판","거더","가로보","교량받침"]).filter((v,i,a)=>v&&a.indexOf(v)===i).slice(0,16)})}
async function renameCell(pg,bid,r,c){const b=(pg.bands||[]).find(x=>x.id===bid);if(!b)return;const v=await nameAsk(pg,"띠 칸 이름",(b.names||{})[r+":"+c]);if(v==null)return;
 const bands=pg.bands.map(x=>x.id===bid?{...x,names:{...(x.names||{}),[r+":"+c]:v.trim()}}:x);await savePageZ(pg,{bands})}
async function renameZone(pg,z){const v=await nameAsk(pg,"작은 구역 이름",z.name);if(v==null)return;const zones=(pg.zones||[]).map(x=>x.id===z.id?{...x,name:v.trim()}:x).filter(x=>x.name);S.zsel=null;await savePageZ(pg,{zones})}
function addCut(pg,bid,dir){const b=(pg.bands||[]).find(x=>x.id===bid);if(!b)return;const key=dir==="h"?"hs":"vs";const arr=[0,...(b[key]||[]),1];let k=0,gap=0;for(let i=0;i<arr.length-1;i++)if(arr[i+1]-arr[i]>gap){gap=arr[i+1]-arr[i];k=i}
 const nv=(arr[k]+arr[k+1])/2;const cuts=[...(b[key]||[]),nv].sort((a,b)=>a-b);const idx=cuts.indexOf(nv);const names={};
 Object.entries(b.names||{}).forEach(([rc,n])=>{let[r,c]=rc.split(":").map(Number);if(dir==="h"){if(r>idx)r++;}else{if(c>idx)c++;}names[r+":"+c]=n});
 Object.entries(b.names||{}).forEach(([rc,n])=>{const[r,c]=rc.split(":").map(Number);if(dir==="h"&&r===idx)names[(r+1)+":"+c]=n;if(dir==="v"&&c===idx)names[r+":"+(c+1)]=n});
 return savePageZ(pg,{bands:pg.bands.map(x=>x.id===bid?{...x,[key]:cuts,names}:x)})}
function delCut(pg,bid,dir,i){const b=(pg.bands||[]).find(x=>x.id===bid);if(!b)return;const key=dir==="h"?"hs":"vs";const cuts=(b[key]||[]).filter((_,k)=>k!==i);const names={};
 Object.entries(b.names||{}).forEach(([rc,n])=>{let[r,c]=rc.split(":").map(Number);if(dir==="h"){if(r===i+1){if(!(b.names||{})[i+":"+c])names[i+":"+c]=n;return}if(r>i+1)r--;}else{if(c===i+1){if(!(b.names||{})[r+":"+i])names[r+":"+i]=n;return}if(c>i+1)c--;}names[r+":"+c]=names[r+":"+c]||n});
 S.zsel=null;return savePageZ(pg,{bands:pg.bands.map(x=>x.id===bid?{...x,[key]:cuts,names}:x)})}
function zoneBar(){const on=S.mode==="zone"&&!!curPage();$("zoneBar").style.display=on?"flex":"none";$("zAi").style.display=$("zAiAll").style.display=aiReady()?"":"none";
 $("zBand").classList.toggle("on",S.zTool==="band");$("zBox").classList.toggle("on",S.zTool==="box")}

$("zClear").onclick=async()=>{const pg=curPage();if(!pg||!allZones(pg).length)return;if(!await confirmBox("구역 지우기","이 도면의 띠·구역을 모두 지울까요?"))return;S.zsel=null;await savePageZ(pg,{zones:[],bands:[]})};
$("zCopy").onclick=async()=>{const pg=curPage();if(!pg||!allZones(pg).length){toast("먼저 이 도면에 구역을 나누세요");return}
 const key=String(pg.member||"").trim();const tg=sortedPages().filter(p=>p.id!==pg.id&&p.isDrawing!==false&&(key?String(p.member||"").trim()===key:false));
 if(!tg.length){toast(key?`'${key}' 부재 도면이 더 없어요 (도면정보의 망도부재로 판단)`:"도면정보에 망도부재가 없어 같은 부재 도면을 찾을 수 없어요",5000);return}
 if(!await confirmBox("구역 복사",`이 도면의 띠·구역을 '${key}' 도면 ${tg.length}장에 복사할까요? 그 도면들의 기존 구역은 바뀝니다.`))return;
 for(const p of tg){const sx=p.w/pg.w,sy=p.h/pg.h;const sc=b=>[r1(b[0]*sx),r1(b[1]*sy),r1(b[2]*sx),r1(b[3]*sy)];
  await savePage({...p,zones:(pg.zones||[]).map(z=>({id:"Z"+uid().slice(0,8),name:z.name,box:sc(z.box)})),bands:(pg.bands||[]).map(b=>({...b,id:"B"+uid().slice(0,8),box:sc(b.box)}))})}
 toast(`${tg.length}장에 구역을 복사했어요`)};
/* 구역 모드 옆 패널: 구역 목록 */
function renderZonePanel(){const pg=curPage(),el=$("list");$("listTitle").textContent="부재 구역";if(!pg){el.innerHTML="";return}
 const bands=pg.bands||[],zs=pg.zones||[];$("listCount").textContent=`띠 ${bands.length} · 작은 구역 ${zs.length}`;$("sum").innerHTML='<span class="muted">손상을 그리면 그 자리의 구역 이름이 손상위치(부재)에 자동으로 들어가요.</span>';
 let h="";if(!bands.length&&!zs.length)h=`<div class="muted" style="padding:12px;line-height:1.6">① 위의 <b>▤ 띠로 나누기</b>를 누르고 도면 그림 테두리를 대각선으로 감싸세요.<br>② 가로선·세로선을 끌어 위치를 맞추고, 칸을 톡 눌러 이름을 정하세요.<br>③ 배수구 같은 작은 부재는 <b>□ 작은 구역</b>으로 따로 감싸세요.</div>`;
 bands.forEach((b,bi)=>{const cells=bandCells(b);h+=`<div style="padding:8px 10px;border-bottom:1px solid var(--line)"><div class="row" style="margin-bottom:6px"><b style="flex:1">띠 묶음 ${bi+1}</b><button class="btn" data-addh="${b.id}" style="padding:4px 8px;font-size:12px">＋가로선</button><button class="btn" data-addv="${b.id}" style="padding:4px 8px;font-size:12px">＋세로선</button><button class="btn dng" data-delb="${b.id}" style="padding:4px 8px;font-size:12px">삭제</button></div>`+
  cells.map(c=>`<div class="row" data-selcell="${b.id}:${c.r}:${c.c}" style="padding:4px 2px;cursor:pointer;${S.zsel&&S.zsel.t==="cell"&&S.zsel.band===b.id&&S.zsel.r===c.r&&S.zsel.c===c.c?"background:#fef9c3;":""}"><span style="width:12px;height:12px;border-radius:3px;background:${c.name?zcol(c.name):"#cbd5e1"}"></span><span style="flex:1">${(b.vs||[]).length?`${c.r+1}행 ${c.c+1}열`:`${c.r+1}번째 띠`} · <b>${esc(c.name||"이름 없음")}</b></span><button class="btn" data-rncell="${b.id}:${c.r}:${c.c}" style="padding:3px 8px;font-size:12px">이름</button></div>`).join("")+`</div>`});
 if(zs.length)h+=`<div style="padding:8px 10px"><b>작은 구역</b>`+zs.map(z=>`<div class="row" data-selzone="${z.id}" style="padding:4px 2px;cursor:pointer;${S.zsel&&S.zsel.t==="zone"&&S.zsel.id===z.id?"background:#fef9c3;":""}"><span style="width:12px;height:12px;border-radius:3px;background:${zcol(z.name)}"></span><b style="flex:1">${esc(z.name)}</b><button class="btn" data-rnzone="${z.id}" style="padding:3px 8px;font-size:12px">이름</button><button class="btn dng" data-delzone="${z.id}" style="padding:3px 8px;font-size:12px">삭제</button></div>`).join("")+`</div>`;
 if(S.zsel&&S.zsel.t==="cut")h=`<div style="padding:8px 10px;background:#fef9c3" class="row"><span style="flex:1">선택한 ${S.zsel.dir==="h"?"가로":"세로"}선</span><button class="btn dng" id="zDelCut" style="padding:4px 10px">선 삭제</button></div>`+h;
 el.innerHTML=h;
 el.querySelectorAll("[data-addh]").forEach(x=>x.onclick=()=>addCut(curPage(),x.dataset.addh,"h"));el.querySelectorAll("[data-addv]").forEach(x=>x.onclick=()=>addCut(curPage(),x.dataset.addv,"v"));
 el.querySelectorAll("[data-delb]").forEach(x=>x.onclick=async()=>{if(await confirmBox("띠 묶음 삭제","이 띠 묶음을 지울까요?")){const pg=curPage();S.zsel=null;await savePageZ(pg,{bands:(pg.bands||[]).filter(b=>b.id!==x.dataset.delb)})}});
 el.querySelectorAll("[data-selcell]").forEach(x=>x.onclick=e=>{if(e.target.closest("button"))return;const[b,r,c]=x.dataset.selcell.split(":");S.zsel={t:"cell",band:b,r:+r,c:+c};renderMarks();renderZonePanel()});
 el.querySelectorAll("[data-rncell]").forEach(x=>x.onclick=()=>{const[b,r,c]=x.dataset.rncell.split(":");renameCell(curPage(),b,+r,+c)});
 el.querySelectorAll("[data-selzone]").forEach(x=>x.onclick=e=>{if(e.target.closest("button"))return;S.zsel={t:"zone",id:x.dataset.selzone};renderMarks();renderZonePanel()});
 el.querySelectorAll("[data-rnzone]").forEach(x=>x.onclick=()=>{const pg=curPage();const z=(pg.zones||[]).find(q=>q.id===x.dataset.rnzone);if(z)renameZone(pg,z)});
 el.querySelectorAll("[data-delzone]").forEach(x=>x.onclick=async()=>{const pg=curPage();S.zsel=null;await savePageZ(pg,{zones:(pg.zones||[]).filter(z=>z.id!==x.dataset.delzone)})});
 const dc=$("zDelCut");if(dc)dc.onclick=()=>{const s=S.zsel;delCut(curPage(),s.band,s.dir,s.i)}}
/* AI: 구역 모양은 그리지 않고 부재 이름 목록만 */
const NAMES_PROMPT=`이 이미지는 시설물 외관조사망도입니다. 손상을 그려 넣는 도면 그림 영역에 나오는 부재(조사 대상 부위)의 이름을 모두 나열하세요. 망도에 적힌 표기(예: "교면포장", "난간및연석", "배수구", "신축이음", "4차로" 같은 차로 표기는 제외)를 우선하고, 표제란·범례·손상물량표 글자는 제외합니다. 망도에 글자가 없으면 그림으로 판단해 표준 명칭(교면포장, 난간및연석, 배수시설, 신축이음, 바닥판, 거더, 가로보, 교량받침, 흉벽, 구체, 날개벽, 기초, 코핑, 기둥, 라이닝 등)을 쓰세요. 위에서 아래(또는 왼쪽에서 오른쪽) 순서로. JSON 하나만 출력: {"members":["난간및연석","교면포장","난간및연석"]}`;
async function aiNames(ids){if(!aiReady()){toast("이 화면에서는 AI를 쓸 수 없어요",4000);return}let i=0,done=0,fail=0;progress(`부재 이름 판독 0/${ids.length}`,0);
 const work=async id=>{try{const pg=S.pages.get(id);if(!pg||pg.isDrawing===false)return;const bm=await pageBitmap(pg);const r=await aiJson(NAMES_PROMPT,await cropBlob(bm,0,0,bm.width,bm.height,1568));bm.close&&bm.close();
   const ms=[...new Set((r.members||[]).map(v=>String(v).trim()).filter(Boolean))];if(ms.length)await savePage({...S.pages.get(id),memberNames:ms})}catch(e){console.warn(e);fail++}done++;progress(`부재 이름 판독 ${done}/${ids.length}`,done/ids.length)};
 await Promise.all([0,1,2].map(async()=>{while(i<ids.length)await work(ids[i++])}));progress(null);renderList();const pg=curPage();
 toast(`부재 이름 판독 완료${fail?` (실패 ${fail}장)`:""}${pg&&pg.memberNames?" — 이 도면: "+pg.memberNames.join(", "):""}`,6000)}
$("zAi").onclick=()=>{const pg=curPage();if(pg)aiNames([pg.id])};
$("zAiAll").onclick=async()=>{const ids=sortedPages().filter(p=>p.isDrawing!==false).map(p=>p.id);if(await confirmBox("부재 이름 판독",`도면 ${ids.length}장에서 부재 이름 목록을 AI가 읽습니다.`))aiNames(ids)};
/* 같은 손상 여러 개 (한 번호로 묶고 개소 자동 증가) */
/* 묶음의 추가 손상은 모양은 그린 대로, 크기는 첫 손상과 같게 맞춤 */
const plen=p=>{let L=0;for(let i=2;i<p.length;i+=2)L+=Math.hypot(p[i]-p[i-2],p[i+1]-p[i-1]);return L};
const bbox=p=>{const xs=p.filter((_,i)=>i%2===0),ys=p.filter((_,i)=>i%2===1);return[Math.min(...xs),Math.min(...ys),Math.max(...xs),Math.max(...ys)]};
function scaleAbout(p,cx,cy,k){return p.map((v,i)=>r1(i%2===0?cx+(v-cx)*k:cy+(v-cy)*k))}
function fitPartSize(m,part,tap){const base=m.pts||[];if(base.length<4||m.geom==="point")return part;const[cx0,cy0]=centroid(base);
 if(tap||part.length===2){const[tx,ty]=[part[0],part[1]];return base.map((v,i)=>r1(i%2===0?v-cx0+tx:v-cy0+ty))}
 const[cx,cy]=centroid(part);
 if(m.geom==="line"){const bl=plen(base),l=plen(part);return l>0?scaleAbout(part,cx,cy,bl/l):part}
 const bb=bbox(base),pb=bbox(part);const bw=bb[2]-bb[0],bh=bb[3]-bb[1],pw=pb[2]-pb[0],ph=pb[3]-pb[1];
 if(part.length===8&&part[1]===part[3]&&part[0]===part[6]){const x0=r1(cx-bw/2),x1=r1(cx+bw/2),y0=r1(cy-bh/2),y1=r1(cy+bh/2);return[x0,y0,x1,y0,x1,y1,x0,y1]}
 const k=Math.sqrt((bw*bh)/Math.max(1e-6,pw*ph));return scaleAbout(part,cx,cy,k)}
function startMulti(id){const m=S.marks.get(id);if(!m)return;S.multi=id;S.mode="draw";renderTools();multiBarUpd();$("multiBar").style.display="flex";hint("같은 크기의 손상 위치를 계속 그리세요 · 끝나면 완료",4000)}
function stopMulti(){S.multi=null;$("multiBar").style.display="none"}
function multiBarUpd(){const m=S.marks.get(S.multi);if(!m){stopMulti();return}$("multiTxt").textContent=`${markNo(m)}번 ${m.desc||lg(m.type).n} 묶음 그리는 중 · ${1+(m.parts||[]).length}개`}
$("multiDone").onclick=()=>{const m=S.marks.get(S.multi);stopMulti();if(m)toast(`${markNo(m)}번 ${m.desc||""}: ${m.cnt}개소로 저장했어요`)};
$("multiUndo").onclick=async()=>{const m=S.marks.get(S.multi);if(!m||!(m.parts||[]).length)return;const parts=m.parts.slice(0,-1);await saveMark({...m,parts,cnt:String(1+parts.length),updatedAt:Date.now()});multiBarUpd()};

 const t=ls("ins.tool");if(t&&legend().some(l=>l.k===t))S.tool=t;const mc=ls("ins.mc");if(mc&&MEMO_COLORS.includes(mc))S.memoColor=mc;

 });
}
